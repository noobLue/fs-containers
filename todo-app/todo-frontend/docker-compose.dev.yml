services:
  app:
    image: todo-front-dev
    ports:
      - 5173:5173
    environment:
      - VITE_BACKEND_URL=http://localhost:3000
    volumes:
      - ./:/usr/src/app:z
    build:
      context: .
      dockerfile: dev.Dockerfile
    container_name: todo-front-dev

  debug-helper:
    image: busybox